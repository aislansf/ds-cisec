name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Smoke contínuo da URL pública: a cada 6h
    - cron: "0 */6 * * *"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Build (fail fast before tests)
        run: npm run build

      - name: Upload legacy typography report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-typography-report
          path: |
            reports/legacy-typography-report.txt
            reports/legacy-typography-baseline.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate design tokens (site ↔ src/index.css)
        run: npm run test:tokens

      - name: Sidebar regression test (320px, logo 60×60, no text clipping)
        run: npm run test:sidebar

      - name: Create SPA .htaccess
        run: |
          cat > dist/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Deploy via FTP (com retentativas e backoff exponencial)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          MAX_ATTEMPTS=5
          DELAY=10
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "::group::Tentativa $ATTEMPT/$MAX_ATTEMPTS de deploy FTP"
            if npx --yes @samkirkland/ftp-deploy@4.3.5 \
                --server "$FTP_SERVER" \
                --username "$FTP_USERNAME" \
                --password "$FTP_PASSWORD" \
                --protocol ftp \
                --port 21 \
                --local-dir "dist/" \
                --server-dir "/public_html/ds/" \
                --timeout 120000 \
                --log-level verbose \
                --exclude "**/.git*" "**/.git*/**" "**/.github/**" "**/node_modules/**"; then
              echo "::endgroup::"
              echo "Deploy concluído na tentativa $ATTEMPT."
              exit 0
            fi
            echo "::endgroup::"
            echo "Falha na tentativa $ATTEMPT. Aguardando ${DELAY}s antes de tentar novamente..."
            sleep "$DELAY"
            ATTEMPT=$((ATTEMPT + 1))
            DELAY=$((DELAY * 2))
          done
          echo "Deploy FTP falhou após $MAX_ATTEMPTS tentativas."
          exit 1

  smoke-public-url:
    name: Smoke test da URL pública (HTTP + render)
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    # Roda após o deploy E em cada execução agendada (sem depender do deploy)
    if: ${{ always() && (needs.build-and-deploy.result == 'success' || github.event_name == 'schedule') }}
    env:
      SMOKE_URL: ${{ vars.SMOKE_URL || 'https://sebrae-ce.dscreator.com.br/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Aguardar propagação do deploy
        if: github.event_name != 'schedule'
        run: sleep 30

      - name: Smoke (HTTP + render)
        run: node scripts/smoke-public-url.mjs "$SMOKE_URL" --render

      - name: Homepage H1 computed color (#005EB8)
        run: node scripts/check-homepage-h1-computed.mjs "$SMOKE_URL"

      - name: Homepage botões/links — tokens tipográficos e de cor (responsivo)
        run: node scripts/check-homepage-interactive-tokens.mjs "$SMOKE_URL"
